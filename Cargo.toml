[package]
name = "blog_rust"
version = "0.1.0"
edition = "2021"
description = "A minimal blog web application written in Rust with axum and SQLite."
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 0
